name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Verify API
        working-directory: apps/api
        run: |
          python -m ruff check app tests
          python -m mypy app
          python -m pytest -q
      - name: Run deterministic evals
        working-directory: apps/api
        run: python -m app.evals.runner
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Verify web
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  worker-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Worker
        working-directory: apps/worker
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Verify Worker
        working-directory: apps/worker
        run: |
          python -m ruff check agentgate_worker tests
          python -m mypy agentgate_worker
          python -m pytest -q
      - name: Run Windows file contract
        shell: pwsh
        run: ./scripts/file-action.contract.test.ps1

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentgate_test
          POSTGRES_USER: agentgate
          POSTGRES_PASSWORD: agentgate-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentgate -d agentgate_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Verify PostgreSQL migrations and queue concurrency
        working-directory: apps/api
        env:
          AGENTGATE_TEST_DATABASE_URL: postgresql+psycopg://agentgate:agentgate-test-only@127.0.0.1:5432/agentgate_test
        run: |
          python -m pytest -q tests/test_migrations.py tests/test_failure_injection.py tests/test_worker_protocol.py
