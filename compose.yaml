services:
  api:
    build: ./apps/api
    env_file:
      - .env
    environment:
      AGENTGATE_LLM_PROVIDER: ${AGENTGATE_LLM_PROVIDER:-mock}
      AGENTGATE_DATABASE_URL: sqlite:///./data/agentgate.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
  web:
    build: ./apps/web
    depends_on:
      - api
    ports:
      - "5173:80"
