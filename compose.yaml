services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentgate
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: ${AGENTGATE_POSTGRES_PASSWORD:-agentgate}
    volumes:
      - agentgate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate -d agentgate"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      AGENTGATE_LLM_PROVIDER: ${AGENTGATE_LLM_PROVIDER:-mock}
      AGENTGATE_DATABASE_URL: postgresql+psycopg://agentgate:${AGENTGATE_POSTGRES_PASSWORD:-agentgate}@postgres:5432/agentgate
      AGENTGATE_WEB_ORIGIN: ${AGENTGATE_WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENTGATE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  scheduler:
    build: ./apps/api
    command: ["python", "-m", "app.processes.scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      AGENTGATE_DATABASE_URL: postgresql+psycopg://agentgate:${AGENTGATE_POSTGRES_PASSWORD:-agentgate}@postgres:5432/agentgate
      AGENTGATE_SCHEDULER_ROLE: due-task-enqueue-and-lease-cleanup
    depends_on:
      postgres:
        condition: service_healthy
  control-worker:
    build: ./apps/api
    command: ["python", "-m", "app.processes.control_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      AGENTGATE_LLM_PROVIDER: ${AGENTGATE_LLM_PROVIDER:-mock}
      AGENTGATE_DATABASE_URL: postgresql+psycopg://agentgate:${AGENTGATE_POSTGRES_PASSWORD:-agentgate}@postgres:5432/agentgate
      AGENTGATE_WORKER_ROLE: durable-control-task-processor
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENTGATE_WEB_PORT:-5173}:80"

volumes:
  agentgate-postgres-data:
