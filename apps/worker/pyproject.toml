[project]
name = "agentgate-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
agentgate-worker = "agentgate_worker.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
