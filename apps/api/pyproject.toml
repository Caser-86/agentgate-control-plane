[project]
name = "agentgate-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "openai>=3.6,<4",
  "pydantic-settings>=2.15,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlmodel>=0.0.42,<0.1",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
